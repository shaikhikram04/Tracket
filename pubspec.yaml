name: tracket
description: "A new Flutter project."

publish_to: "none" 

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  animate_do: ^3.3.4
  animated_text_kit: ^4.2.3
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.5.0
  confetti: ^0.8.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.6
  device_preview: ^1.2.0
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  flutter_slidable: ^4.0.0
  flutter_speed_dial: ^7.0.0
  google_fonts: ^6.2.1
  http: ^1.3.0
  image_cropper: ^9.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  lottie: ^3.3.1
  supabase_flutter: ^2.8.4
  uuid: ^4.4.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "#ffffff"
  image: assets/splash/splash_light.png
  color_dark: "#121212"
  image_dark: assets/splash/splash_dark.png

  android: true
  ios: true

  android_12:
    image: assets/splash/android12_light.png
    icon_background_color: "#ffffff"
    image_dark: assets/splash/android12_dark.png
    icon_background_color_dark: "#121212"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/splash/
    - .env

  fonts:
    - family: rubik
      fonts:
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Italic.ttf
          style: italic
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-MediumItalic.ttf
          style: italic
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 800
