plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

import java.util.Properties
import java.io.FileInputStream

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def readSigningValue = { propertyKey, envKey ->
    def valueFromFile = keystoreProperties.getProperty(propertyKey)
    if (valueFromFile != null && !valueFromFile.trim().isEmpty()) {
        return valueFromFile
    }

    def valueFromEnv = System.getenv(envKey)
    if (valueFromEnv != null && !valueFromEnv.trim().isEmpty()) {
        return valueFromEnv
    }

    return null
}

def releaseKeyAlias = readSigningValue('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = readSigningValue('keyPassword', 'ANDROID_KEY_PASSWORD')
def releaseStoreFile = readSigningValue('storeFile', 'ANDROID_STORE_FILE')
def releaseStorePassword = readSigningValue('storePassword', 'ANDROID_STORE_PASSWORD')

android {
    namespace = "com.ikramkolekar.tracket"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ikramkolekar.tracket"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = releaseKeyAlias
            keyPassword = releaseKeyPassword
            storeFile = releaseStoreFile ? file(releaseStoreFile) : null
            storePassword = releaseStorePassword
        }
    }

    buildTypes {
        release {
            if (!releaseKeyAlias || !releaseKeyPassword || !releaseStoreFile || !releaseStorePassword) {
                throw new GradleException(
                    "Missing release signing configuration. Set values in android/key.properties (excluded from git) or ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_STORE_FILE, ANDROID_STORE_PASSWORD environment variables."
                )
            }
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:34.9.0"))
    implementation("com.google.firebase:firebase-analytics")
}

